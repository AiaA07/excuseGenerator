<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1200"/>
<title>Excuse Generator 3000 — OG Card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #E8614A; font-family: 'Inter', sans-serif; position: relative; }
  .safe { padding: 64px; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; position: relative; z-index: 2; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon { width: 48px; height: 48px; }
  .logo-text { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; color: #FFF8EF; letter-spacing: 0.5px; line-height: 1.2; }
  .logo-text span { font-size: 24px; display: block; }
  .main { flex: 1; display: flex; align-items: center; gap: 64px; }
  .copy { flex: 1; }
  h1 { font-family: 'Playfair Display', serif; font-size: 72px; font-weight: 900; color: #FFF8EF; line-height: 1.05; margin-bottom: 20px; }
  .sub { font-size: 22px; color: rgba(255,248,239,0.85); font-weight: 400; line-height: 1.5; max-width: 460px; }
  .gauge-area { width: 300px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .footer-tag { font-size: 14px; color: rgba(255,248,239,0.6); letter-spacing: 3px; text-transform: uppercase; font-weight: 500; }
  /* Background decorative blobs */
  .blob1 { position: absolute; top: -80px; right: -80px; width: 400px; height: 400px; border-radius: 50%; background: rgba(255,255,255,0.08); z-index: 1; }
  .blob2 { position: absolute; bottom: -100px; left: 200px; width: 300px; height: 300px; border-radius: 50%; background: rgba(45,74,107,0.2); z-index: 1; }
  .blob3 { position: absolute; top: 50%; right: 120px; transform: translateY(-50%); width: 200px; height: 200px; border-radius: 50%; background: rgba(245,183,49,0.15); z-index: 1; }
</style>
</head>
<body>
  <div class="blob1"></div>
  <div class="blob2"></div>
  <div class="blob3"></div>
  <div class="safe">
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M10 36 A20 20 0 0 1 38 36" stroke="#FFF8EF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M10 36 A20 20 0 0 1 20 18" stroke="#F5B731" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <line x1="24" y1="36" x2="36" y2="14" stroke="#F5B731" stroke-width="3" stroke-linecap="round"/>
        <circle cx="24" cy="36" r="3.5" fill="#FFF8EF"/>
      </svg>
      <div class="logo-text">
        <span>Excuse Generator</span>
        3000
      </div>
    </div>
    <div class="main">
      <div class="copy">
        <h1>Your excuse.<br>Rated.<br>Exposed.</h1>
        <p class="sub">Generate modern excuses. The Lie Detector rates your alibi's believability — from Truthful to Total Lie.</p>
      </div>
      <div class="gauge-area">
        <svg viewBox="0 0 280 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="280" height="200">
          <!-- Gauge housing -->
          <rect x="10" y="60" width="260" height="140" rx="24" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
          <!-- Gauge arc background -->
          <path d="M40 155 A100 100 0 0 1 240 155" stroke="rgba(255,255,255,0.15)" stroke-width="16" stroke-linecap="round" fill="none"/>
          <!-- Truth zone (green) -->
          <path d="M40 155 A100 100 0 0 1 90 90" stroke="#5C8C5A" stroke-width="16" stroke-linecap="round" fill="none"/>
          <!-- Plausible zone (gold) -->
          <path d="M90 90 A100 100 0 0 1 140 75" stroke="#F5B731" stroke-width="16" stroke-linecap="round" fill="none"/>
          <!-- Stretching zone (slate) -->
          <path d="M140 75 A100 100 0 0 1 190 90" stroke="#4A6888" stroke-width="16" stroke-linecap="round" fill="none"/>
          <!-- Lie zone (coral) -->
          <path d="M190 90 A100 100 0 0 1 240 155" stroke="#F5917E" stroke-width="16" stroke-linecap="round" fill="none"/>
          <!-- Needle -->
          <line x1="140" y1="155" x2="175" y2="88" stroke="#F5B731" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="140" cy="155" r="8" fill="#FFF8EF" stroke="#F5B731" stroke-width="2"/>
          <!-- Labels -->
          <text x="28" y="178" font-family="Inter,sans-serif" font-size="10" fill="rgba(255,248,239,0.7)">TRUTH</text>
          <text x="218" y="178" font-family="Inter,sans-serif" font-size="10" fill="rgba(255,248,239,0.7)">LIE</text>
          <!-- Badge -->
          <rect x="90" y="170" width="100" height="22" rx="11" fill="rgba(245,183,49,0.25)" stroke="#F5B731" stroke-width="1"/>
          <text x="140" y="185" font-family="JetBrains Mono,monospace" font-size="10" fill="#F5B731" text-anchor="middle" font-weight="600">PLAUSIBLE</text>
        </svg>
      </div>
    </div>
    <div class="footer-tag">excusegenerator3000.com</div>
  </div>
</body>
</html>
